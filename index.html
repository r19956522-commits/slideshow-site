<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت جورچین | تولیدکننده پاورپوینت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- کتابخانه اصلی تولید پاورپوینت -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        body { margin: 0; font-family: 'Tahoma', sans-serif; background: #050505; color: white; }
        .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #050505 100%); }
        .puzzle-piece { position: absolute; border-radius: 20px; background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), rgba(147, 51, 234, 0.15)); backdrop-filter: blur(10px); animation: float 15s infinite ease-in-out; }
        @keyframes float { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-30px) rotate(5deg); } }
        .glass-panel { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-mesh">
        <div class="puzzle-piece w-48 h-48 top-10 left-10"></div>
        <div class="puzzle-piece w-64 h-64 bottom-10 right-5" style="animation-delay: -5s;"></div>
    </div>

    <div class="glass-panel w-full max-w-lg p-8 rounded-3xl shadow-2xl">
        <h1 class="text-3xl font-bold text-center text-blue-400">سایت جورچین</h1>
        <p class="text-center text-slate-400 mb-6">مهندس محمدرسول یزدیان</p>

        <div class="space-y-4">
            <input id="topic" type="text" placeholder="موضوع ارائه..." class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="generatePPT()" class="w-full bg-blue-600 p-4 rounded-xl font-bold text-white hover:bg-blue-700 transition-all">ساخت پاورپوینت ۵۰ اسلایدی</button>
        </div>
        
        <p class="mt-6 text-slate-500 text-[10px] text-center">هرگونه کپی‌برداری از این سایت پیگرد قانونی دارد.</p>
    </div>

    <script>
        function generatePPT() {
            // ۱. تست اولیه برای اینکه مطمئن شویم کد اجرا می‌شود
            alert("در حال ساخت پاورپوینت... لطفاً چند ثانیه صبر کنید.");

            try {
                // ۲. اصلاح شیء سازی (استفاده از نام صحیح کلاس)
                let pptx = new PptxGenJS();
                
                pptx.layout = 'LAYOUT_16x9';
                pptx.author = 'Mohammadrasoul Yazdian';
                pptx.company = 'JorChin';

                for (let i = 1; i <= 50; i++) {
                    let slide = pptx.addSlide();
                    slide.background = { color: '0f172a' };
                    
                    // متن ثابت در تمام اسلایدها
                    slide.addText('سایت جورچین | محمدرسول یزدیان', { x: 0.5, y: 0.1, fontSize: 10, color: '64748b' });
                    
                    if (i === 1) {
                        slide.addText(document.getElementById('topic').value || 'ارائه جدید', { x: 1, y: 2.5, fontSize: 40, bold: true, color: 'ffffff' });
                    } else {
                        slide.addText(`اسلاید شماره ${i}`, { x: 1, y: 1, fontSize: 24, bold: true, color: '3b82f6' });
                        slide.addText('محتوای آموزشی جورچین جهت ارائه هوشمند.', { x: 1, y: 2, fontSize: 18, color: 'cbd5e1' });
                    }
                }

                // ۳. دستور ذخیره سازی
                pptx.writeFile({ fileName: 'JorChin_Presentation.pptx' });
                
            } catch (error) {
                alert("خطا در ساخت فایل: " + error.message);
            }
        }
    </script>
</body>
</html>
