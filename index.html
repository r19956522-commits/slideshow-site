<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سایت جورچین | تولیدکننده پاورپوینت</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        body { margin: 0; overflow-x: hidden; font-family: 'Tahoma', sans-serif; background: #050505; }
        
        /* انیمیشن بک‌گراند */
        .bg-mesh {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: radial-gradient(circle at 50% 50%, #1e293b 0%, #050505 100%);
        }
        .puzzle-piece {
            position: absolute; border-radius: 20px;
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.1), rgba(147, 51, 234, 0.1));
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05);
            animation: float 15s infinite ease-in-out;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-50px) rotate(10deg); }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4">

    <!-- بک‌گراند زنده -->
    <div class="bg-mesh">
        <div class="puzzle-piece" style="width: 200px; height: 200px; top: 10%; left: 10%;"></div>
        <div class="puzzle-piece" style="width: 300px; height: 300px; bottom: 10%; right: 5%; animation-delay: -5s;"></div>
        <div class="puzzle-piece" style="width: 150px; height: 150px; top: 50%; right: 20%; animation-delay: -10s;"></div>
    </div>

    <!-- محتوای اصلی -->
    <div class="glass-panel w-full max-w-lg p-8 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)]">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-black bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-500">جورچین</h1>
            <p class="text-slate-400 mt-2">طراحی حرفه‌ای توسط: مهندس محمدرسول یزدیان</p>
        </div>

        <div class="space-y-5">
            <input id="topic" type="text" placeholder="موضوع ارائه شما چیست؟" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
            <textarea id="details" rows="3" placeholder="توضیحات (مثلاً: ۵۰ اسلاید، علمی، با جداول آماری)" class="w-full p-4 rounded-2xl bg-white/5 border border-white/10 outline-none focus:ring-2 focus:ring-blue-500 transition-all"></textarea>
            
            <button onclick="generatePPT()" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 p-4 rounded-2xl font-bold text-lg hover:scale-[1.02] transition-all shadow-lg shadow-blue-900/20">
                ساخت هوشمند پاورپوینت (۵۰ اسلاید)
            </button>
        </div>

        <p class="mt-8 text-center text-slate-500 text-xs leading-relaxed">
            تمامی حقوق متعلق به سایت جورچین است.<br>
            هرگونه کپی‌برداری از ساختار و کد این سایت پیگرد قانونی دارد.
        </p>
    </div>

    <script>
        async function generatePPT() {
            const topic = document.getElementById('topic').value || "ارائه علمی";
            const pptx = new PctxGenJS ? new PptxGenJS() : new PptxGenJS(); // Fix reference
            
            pptx.layout = 'LAYOUT_16x9';
            pptx.author = 'Mohammadrasoul Yazdian';
            pptx.company = 'JorChin';

            for (let i = 1; i <= 50; i++) {
                let slide = pptx.addSlide();
                slide.background = { color: '050505' }; // Dark theme background
                
                // Branding on every slide
                slide.addText('سایت جورچین | ' + topic, { x: 0.5, y: 0.1, fontSize: 10, color: '475569' });
                slide.addText('توسعه‌دهنده: مهندس محمدرسول یزدیان', { x: 0.5, y: 5.1, fontSize: 8, color: '334155' });
                
                slide.addText(`اسلاید ${i} از ۵۰`, { x: 8, y: 0.1, fontSize: 10, color: '475569' });
                
                if (i === 1) {
                    slide.addText(topic, { x: 1, y: 2.5, fontSize: 44, bold: true, color: 'ffffff' });
                } else {
                    slide.addText(`محتوای بخش ${Math.ceil(i/5)}`, { x: 1, y: 1.5, fontSize: 24, bold: true, color: '3b82f6' });
                    slide.addText('در اینجا توضیحات تخصصی مربوط به موضوع شما قرار می‌گیرد. این قالب به‌صورت خودکار توسط سایت جورچین تولید شده است.', { x: 1, y: 2.5, w: '80%', fontSize: 16, color: 'e2e8f0' });
                }
            }

            pptx.writeFile({ fileName: `JorChin_${topic}.pptx` });
        }
    </script>
</body>
</html>
