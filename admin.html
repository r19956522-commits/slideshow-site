<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>پنل مدیریت محصولات | برق یزدیان</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
            padding: 20px;
        }
        .admin-panel {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 20px;
            border: 2px solid #00d4ff;
            max-width: 1000px;
            width: 100%;
            box-shadow: 0 0 50px rgba(0, 212, 255, 0.1);
        }
        .admin-panel h1 {
            color: #00d4ff;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.8rem;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }
        .admin-panel .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .admin-panel label {
            display: block;
            margin: 10px 0 5px;
            color: #aaa;
        }
        .admin-panel input[type="password"],
        .admin-panel input[type="text"],
        .admin-panel input[type="number"],
        .admin-panel select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            font-size: 1rem;
            direction: rtl;
        }
        .admin-panel button {
            padding: 12px 25px;
            border-radius: 30px;
            border: none;
            background: #00d4ff;
            color: #000;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .admin-panel button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
        }
        .login-box {
            display: block;
            max-width: 400px;
            margin: 0 auto;
        }
        .login-box button {
            width: 100%;
            margin-top: 15px;
        }
        .dashboard {
            display: none;
        }

        /* کارت آمار */
        .stats-card {
            background: #0a0a0a;
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid #333;
            text-align: center;
            margin-bottom: 20px;
        }
        .stats-card .number {
            font-size: 2rem;
            color: #00d4ff;
            font-weight: bold;
        }
        .stats-card .label {
            font-size: 0.9rem;
            color: #888;
        }

        /* جستجو */
        .search-box {
            margin-bottom: 15px;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            font-size: 1rem;
        }

        /* لیست محصولات */
        .product-list {
            max-height: 550px;
            overflow-y: auto;
            margin-top: 10px;
        }
        .product-list::-webkit-scrollbar {
            width: 6px;
        }
        .product-list::-webkit-scrollbar-thumb {
            background: #00d4ff;
            border-radius: 10px;
        }

        .product-item {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            background: #111;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid #333;
        }
        .product-item .img-preview {
            width: 60px;
            height: 60px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #333;
            flex-shrink: 0;
        }
        .product-item input,
        .product-item select {
            flex: 1;
            min-width: 80px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: #fff;
            font-size: 0.9rem;
        }
        .product-item .btn-save {
            background: #00d4ff;
            color: #000;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            flex-shrink: 0;
        }
        .product-item .btn-save:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
        }
        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            flex-shrink: 0;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .file-input-wrapper .btn-file {
            background: #555;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            border: none;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .file-input-wrapper .btn-file:hover {
            background: #777;
        }

        .logout-btn {
            background: #ff4444 !important;
            color: #fff !important;
            margin-top: 20px;
            width: 100%;
        }
        .logout-btn:hover {
            box-shadow: 0 0 30px rgba(255, 68, 68, 0.3) !important;
        }

        .success-msg,
        .error-msg {
            padding: 10px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
            text-align: center;
        }
        .success-msg {
            background: #1a3a1a;
            border: 1px solid #44ff44;
            color: #88ff88;
        }
        .error-msg {
            background: #3a1a1a;
            border: 1px solid #ff4444;
            color: #ff8888;
        }
        .success-msg.show,
        .error-msg.show {
            display: block;
        }

        @media (max-width: 600px) {
            .admin-panel {
                padding: 15px;
            }
            .product-item {
                flex-direction: column;
                align-items: stretch;
            }
            .product-item .img-preview {
                width: 80px;
                height: 80px;
                margin: 0 auto;
            }
            .product-item input {
                min-width: 100%;
            }
            .product-item .btn-save {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="admin-panel" id="adminPanel">
        <h1>🔧 پنل مدیریت محصولات</h1>
        <p class="subtitle">برق یزدیان | ویرایش قیمت، موجودی، نام، نوع و عکس محصولات</p>

        <!-- ===== صفحه ورود ===== -->
        <div class="login-box" id="loginBox">
            <label>رمز عبور ادمین</label>
            <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید" onkeydown="if(event.key==='Enter') login()">
            <button onclick="login()">🔑 ورود به پنل</button>
            <div class="error-msg" id="loginError">❌ رمز عبور اشتباه است!</div>
        </div>

        <!-- ===== داشبورد ===== -->
        <div class="dashboard" id="dashboard">
            <!-- آمار -->
            <div class="stats-card">
                <div class="number" id="totalStock">۰</div>
                <div class="label">📦 موجودی کل (تعداد قطعات)</div>
            </div>

            <!-- جستجو -->
            <div class="search-box">
                <input type="text" id="searchProductAdmin" placeholder="جستجوی محصول..." onkeyup="filterProductsAdmin()">
            </div>

            <!-- لیست محصولات -->
            <div class="product-list" id="productListAdmin">
                <!-- توسط جاوااسکریپت ساخته می‌شود -->
            </div>

            <button onclick="logout()" class="logout-btn">🚪 خروج از پنل</button>
            <div class="success-msg" id="successMsg">✅ تغییرات با موفقیت ذخیره شد!</div>
            <div class="error-msg" id="errorMsg">❌ خطا! لطفاً دوباره تلاش کنید.</div>
        </div>
    </div>

    <script>
        // ============================================================
        // 🔐 رمز عبور ادمین
        // ============================================================
        const ADMIN_PASSWORD = 'my2267123454321';

        // ============================================================
        // 💾 توابع خواندن و نوشتن در localStorage
        // ============================================================
        function loadProducts() {
            const saved = localStorage.getItem('productData');
            if (saved) {
                try { return JSON.parse(saved); } catch (e) { return []; }
            }
            return [];
        }

        function saveProducts(products) {
            localStorage.setItem('productData', JSON.stringify(products));
            updateTotalStock(products);
        }

        function getPlaceholderImage(name) {
            return `https://placehold.co/300x200/1a1a1a/00d4ff?text=${encodeURIComponent(name)}`;
        }

        // ============================================================
        // 📊 به‌روزرسانی موجودی کل
        // ============================================================
        function updateTotalStock(products) {
            if (!products) products = loadProducts();
            let total = 0;
            products.forEach(p => total += p.count);
            document.getElementById('totalStock').textContent = total.toLocaleString();
        }

        // ============================================================
        // 🔑 ورود به پنل
        // ============================================================
        function login() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('loginError').classList.remove('show');
                renderProductsAdmin(loadProducts());
                updateTotalStock();
            } else {
                document.getElementById('loginError').classList.add('show');
                setTimeout(() => document.getElementById('loginError').classList.remove('show'), 3000);
            }
        }

        // ============================================================
        // 🚪 خروج
        // ============================================================
        function logout() {
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('dashboard').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        // ============================================================
        // 📋 رندر محصولات
        // ============================================================
        function renderProductsAdmin(products) {
            const container = document.getElementById('productListAdmin');
            if (!products || products.length === 0) {
                container.innerHTML = '<p style="text-align:center;color:#888;padding:20px;">محصولی یافت نشد.</p>';
                return;
            }

            let html = '';
            products.forEach((p, index) => {
                const imgSrc = p.image || getPlaceholderImage(p.name);
                html += `
                    <div class="product-item" data-index="${index}">
                        <img src="${imgSrc}" alt="${p.name}" class="img-preview" id="preview-${index}">
                        <input type="text" id="pname-${index}" value="${p.name}" placeholder="نام">
                        <input type="text" id="ptype-${index}" value="${p.type || ''}" placeholder="نوع">
                        <input type="number" id="pprice-${index}" value="${p.price}" placeholder="قیمت عددی">
                        <input type="text" id="ppriceText-${index}" value="${p.priceText}" placeholder="متن قیمت">
                        <input type="number" id="pcount-${index}" value="${p.count}" placeholder="موجودی">
                        <div class="file-input-wrapper">
                            <button class="btn-file">📸 عکس</button>
                            <input type="file" accept="image/*" onchange="uploadImage(${index}, this)">
                        </div>
                        <button class="btn-save" onclick="saveProduct(${index})">💾 ذخیره</button>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // ============================================================
        // 📸 آپلود عکس
        // ============================================================
        function uploadImage(index, input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const products = loadProducts();
                if (index < products.length) {
                    products[index].image = e.target.result;
                    saveProducts(products);
                    document.getElementById(`preview-${index}`).src = e.target.result;
                    showSuccess('✅ عکس محصول با موفقیت آپلود شد!');
                }
            };
            reader.readAsDataURL(file);
        }

        // ============================================================
        // 💾 ذخیره تغییرات محصول
        // ============================================================
        function saveProduct(index) {
            const products = loadProducts();
            if (index >= products.length) return;

            const name = document.getElementById(`pname-${index}`).value.trim();
            const type = document.getElementById(`ptype-${index}`).value.trim();
            const price = parseInt(document.getElementById(`pprice-${index}`).value);
            const priceText = document.getElementById(`ppriceText-${index}`).value.trim();
            const count = parseInt(document.getElementById(`pcount-${index}`).value);

            if (!name || isNaN(price) || isNaN(count)) {
                showError('❌ لطفاً همه فیلدها را به‌درستی پر کنید.');
                return;
            }

            products[index].name = name;
            products[index].type = type;
            products[index].price = price;
            products[index].priceText = priceText || price.toLocaleString() + ' تومان';
            products[index].count = count;

            saveProducts(products);
            showSuccess(`✅ محصول "${name}" با موفقیت به‌روز شد!`);
            renderProductsAdmin(products);
        }

        // ============================================================
        // 🔍 جستجو
        // ============================================================
        function filterProductsAdmin() {
            const query = document.getElementById('searchProductAdmin').value.trim().toLowerCase();
            const all = loadProducts();
            if (query === '') {
                renderProductsAdmin(all);
                return;
            }
            const filtered = all.filter(p =>
                p.name.toLowerCase().includes(query) ||
                (p.type && p.type.toLowerCase().includes(query))
            );
            renderProductsAdmin(filtered);
        }

        // ============================================================
        // 💬 پیام‌ها
        // ============================================================
        function showSuccess(msg) {
            const div = document.getElementById('successMsg');
            div.textContent = msg;
            div.classList.add('show');
            setTimeout(() => div.classList.remove('show'), 4000);
        }

        function showError(msg) {
            const div = document.getElementById('errorMsg');
            div.textContent = msg;
            div.classList.add('show');
            setTimeout(() => div.classList.remove('show'), 4000);
        }

        // ============================================================
        // ⌨️ ورود با کلید Enter
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginBox = document.getElementById('loginBox');
                if (loginBox.style.display !== 'none') {
                    login();
                }
            }
        });

        // ============================================================
        // 🚀 اجرای اولیه
        // ============================================================
        console.log('پنل مدیریت محصولات برق یزدیان بارگذاری شد.');
    </script>

</body>
</html>
